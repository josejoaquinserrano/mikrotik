---
- name: Respaldar configuracion de routers MikroTik con Git y Retencion
  hosts: all
  gather_facts: no
  connection: network_cli 
  vars:
    ansible_network_os: community.network.routeros 
    backup_dir: "/var/lib/semaphore/mikrotik-backups"
    repo_url: "https://github.com/josejoaquinserrano/backups.git"

  tasks:
    # --- 1. PREPARACIÓN Y CONFIGURACIÓN LOCAL ---
    - name: Asegurar que el directorio local es un repositorio Git y tiene la URL correcta
      delegate_to: localhost
      run_once: true
      ansible.builtin.shell: |
        if [ ! -d ".git" ]; then
          git init
          git remote add origin {{ repo_url }}
        else
          git remote set-url origin {{ repo_url }}
        fi
      args:
        chdir: "./"

    - name: Crear directorio local de respaldos si no existe
      delegate_to: localhost
      run_once: true
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0755'

    # --- 2. EXTRACCIÓN Y GUARDADO DEL RESPALDO --
    
    - name: Obtener exportacion de configuracion segura (sin datos sensibles)
      community.network.routeros_command:
        commands:
          - /export
      register: router_export
      
    - name: Validar que la exportación es correcta
      ansible.builtin.assert:
        that:
          - router_export.stdout is defined
          - router_export.stdout | length > 0
          - "'expected end of command' not in (router_export.stdout | string)"
        fail_msg: "La exportación de {{ inventory_hostname }} ha fallado; no se guardará el RSC."

    - name: Guardar la configuracion con timestamp por cada router
      delegate_to: localhost
      ansible.builtin.copy:
        content: "{{ router_export.stdout }}"
        dest: "{{ backup_dir }}/{{ inventory_hostname }}_config.rsc"

    - name: Mostrar mensaje de éxito individual
      ansible.builtin.debug:
        msg: "Respaldo seguro guardado localmente para {{ inventory_hostname }}"

    - name: Crear backup binario en MikroTik
      community.network.routeros_command:
        commands:
          - "/system/backup/save name={{ inventory_hostname }}_backup"

    - name: Descargar backup binario al servidor Semaphore
      ansible.netcommon.net_get:
        src: "{{ inventory_hostname }}_backup.backup"
        dest: "{{ backup_dir }}/{{ inventory_hostname }}_{{ now(fmt='%Y-%m-%d_%H%M') }}.backup"
        protocol: scp

    - name: Eliminar backup temporal del MikroTik
      community.network.routeros_command:
        commands:
          - "/file/remove [find name=\"{{ inventory_hostname }}_backup.backup\"]"

    # --- 3. POLÍTICA DE RETENCIÓN (BORRAR CON >30 DÍAS) ---
    - name: Buscar archivos de respaldo más antiguos de 30 días
      delegate_to: localhost
      run_once: true
      ansible.builtin.find:
        paths: "{{ backup_dir }}"
        age: 30d
        patterns: "*.rsc"
      register: archivos_viejos

    - name: Eliminar respaldos obsoletos
      delegate_to: localhost
      run_once: true
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ archivos_viejos.files }}"
    

    - name: Hacer commit y push de los cambios a Git
      delegate_to: localhost
      run_once: true
      ansible.builtin.shell: |
        set -eu
        export GIT_TERMINAL_PROMPT=0

        git config user.name "Ansible Backup Automation"
        git config user.email "ansible@localhost"
        git add -A -- /var/lib/semaphore/mikrotik-backups/*.rsc

        if ! git diff --cached --quiet; then
          git commit -m "Automatizado: Respaldos MikroTik - $(date '+%Y-%m-%d %H:%M')"

          ASKPASS_SCRIPT="$(mktemp)"
          trap 'rm -f "$ASKPASS_SCRIPT"' EXIT

          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\n" "josejoaquinserrano" ;;' \
            '  *Password*) printf "%s\n" "$GITHUB_TOKEN" ;;' \
            'esac' > "$ASKPASS_SCRIPT"

          chmod 700 "$ASKPASS_SCRIPT"
          export GIT_ASKPASS="$ASKPASS_SCRIPT"

          echo "Sincronizando rama remota..."
          git fetch origin main

          echo "Integrando cambios remotos..."
          git -c user.name="Ansible Backup Automation" \
              -c user.email="ansible@localhost" \
              merge --no-edit origin/main

          echo "Subiendo backups a la rama remota main..."
          timeout 45s git push origin HEAD:main
          echo "Push finalizado correctamente."
        else
          echo "No hay cambios nuevos que subir."
        fi
      args:
        chdir: "./"
      environment:
        GIT_TERMINAL_PROMPT: "0"
        GITHUB_TOKEN: "{{ github_token }}"
      no_log: false
