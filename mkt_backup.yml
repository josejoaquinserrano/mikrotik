---
- name: Respaldar configuracion de routers MikroTik
  hosts: GNS3
  gather_facts: no
  connection: network_cli 
  vars:
    ansible_network_os: community.network.routeros 

  tasks:
    - name: Crear directorio local de respaldos si no existe
      delegate_to: localhost
      run_once: true
      ansible.builtin.file:
        path: "./backups/mikrotik/"
        state: directory
        mode: '0755'

    - name: Obtener exportacion de configuracion segura (sin datos sensibles)
      community.network.routeros_command:
        commands:
          - /export show-sensitive=no
      register: router_export

    - name: Guardar la configuracion con timestamp por cada router
      delegate_to: localhost
      ansible.builtin.copy:
        content: "{{ router_export.stdout }}"
        dest: "./backups/mikrotik/{{ inventory_hostname }}_config_{{ now(fmt='%Y-%m-%d_%H%M') }}.rsc"

    - name: Mostrar mensaje de éxito
      ansible.builtin.debug:
        msg: "Respaldo seguro completado para {{ inventory_hostname }} guardado en ./backups/mikrotik/{{ inventory_hostname }}_config_{{ now(fmt='%Y-%m-%d_%H%M') }}.rsc"
