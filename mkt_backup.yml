---
- name: Respaldar configuracion de routers MikroTik
  hosts: GNS3
  gather_facts: no

  vars:
    ansible_network_os: community.network.routeros
    ansible_connection: network_cli

  tasks:
    - name: Crear directorio local de respaldos si no existe
      delegate_to: localhost
      run_once: true
      ansible.builtin.file:
        path: "./backups/mikrotik/"
        state: directory
        mode: '0755'

    - name: Obtener exportacion de configuracion en texto plano
      community.network.routeros_command:
        commands:
          - /export
      register: router_export

    - name: Guardar la configuracion en un archivo local por cada router
      delegate_to: localhost
      ansible.builtin.copy:
        content: "{{ router_export.stdout[0] }}"
        dest: "./backups/{{ inventory_hostname }}_config.rsc"

    - name: Mostrar mensaje de éxito
      ansible.builtin.debug:
        msg: "Respaldo completado para {{ inventory_hostname }} guardado en backups/{{ inventory_hostname }}_config.rsc"
