---
- name: Configurar circuito FTTH
  hosts: all
  gather_facts: false
  connection: local
  module_defaults:

    community.routeros.api_modify:
      hostname: "{{ ansible_host }}"
      username: "autotrc"
      password: "{{ autotrc_pwd }}"
   

    community.routeros.api:
      hostname: "{{ ansible_host }}"
      username: "autotrc"
      password: "{{ autotrc_pwd }}"

  tasks:
    - name: Ejecutar las tareas de configuración del circuito
      ansible.builtin.include_tasks:
        file: play_crear_circuito_ftth.yml
        
